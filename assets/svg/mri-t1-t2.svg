<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 360" role="img" aria-labelledby="t d">
  <title id="t">T1 recovery and T2 decay</title>
  <desc id="d">Two plots sharing a time axis: Mz recovering toward M0 with a T1 tick at about 0.63 M0, and Mxy decaying with a T2 tick at about 0.37 of start.</desc>
  <rect width="780" height="360" fill="#0d1117"/>
  <defs>
    <marker id="ahAx" markerWidth="8" markerHeight="8" refX="6.5" refY="4" orient="auto">
      <path d="M0 0 L8 4 L0 8 z" fill="#c8d0dc"/>
    </marker>
  </defs>
  <g>
    <line x1="70" y1="268" x2="70" y2="48" stroke="#c8d0dc" stroke-width="1.5" marker-end="url(#ahAx)"/>
    <line x1="70" y1="268" x2="350" y2="268" stroke="#c8d0dc" stroke-width="1.5" marker-end="url(#ahAx)"/>
    <text x="54" y="78" fill="#5eead4" font-family="DejaVu Serif, Liberation Serif, Georgia, serif" font-style="italic" font-size="15">Mz</text>
    <text x="348" y="290" fill="#c8d0dc" font-family="DejaVu Serif, Liberation Serif, Georgia, serif" font-style="italic" font-size="15">t</text>
    <line x1="70" y1="72" x2="338" y2="72" stroke="#5eead4" stroke-width="1.15" stroke-dasharray="3 4" opacity="0.45"/>
    <text x="338" y="68" fill="#5eead4" font-family="DejaVu Serif, Liberation Serif, Georgia, serif" font-style="italic" font-size="14">M0</text>
    <path d="M70 268 C98 198 128 158 154 145 C198 124 242 102 282 88 C308 80 330 76 338 74" fill="none" stroke="#5eead4" stroke-width="2.2" stroke-linecap="round"/>
    <line x1="154" y1="268" x2="154" y2="145" stroke="#e8d48b" stroke-width="1.15" stroke-dasharray="3 3" opacity="0.8"/>
    <line x1="70" y1="145" x2="154" y2="145" stroke="#e8d48b" stroke-width="1.15" stroke-dasharray="3 3" opacity="0.8"/>
    <circle cx="154" cy="145" r="3.5" fill="#e8d48b"/>
    <text x="160" y="290" fill="#e8d48b" font-family="DejaVu Sans, Noto Sans, Liberation Sans, sans-serif" font-size="14">T1</text>
    <text x="76" y="140" fill="#c8d0dc" font-family="DejaVu Sans, Noto Sans, Liberation Sans, sans-serif" font-size="12">0.63 M0</text>
    <text x="210" y="332" text-anchor="middle" fill="#c8d0dc" font-family="DejaVu Sans, Noto Sans, Liberation Sans, sans-serif" font-size="14">Mz recovers</text>
  </g>
  <g>
    <line x1="430" y1="268" x2="430" y2="48" stroke="#c8d0dc" stroke-width="1.5" marker-end="url(#ahAx)"/>
    <line x1="430" y1="268" x2="710" y2="268" stroke="#c8d0dc" stroke-width="1.5" marker-end="url(#ahAx)"/>
    <text x="368" y="78" fill="#ff8b94" font-family="DejaVu Serif, Liberation Serif, Georgia, serif" font-style="italic" font-size="15">Mxy</text>
    <text x="708" y="290" fill="#c8d0dc" font-family="DejaVu Serif, Liberation Serif, Georgia, serif" font-style="italic" font-size="15">t</text>
    <line x1="430" y1="72" x2="438" y2="72" stroke="#ff8b94" stroke-width="1.15"/>
    <path d="M430 72 C456 100 488 148 514 196 C556 236 600 252 640 260 C668 264 690 266 698 267" fill="none" stroke="#ff8b94" stroke-width="2.2" stroke-linecap="round"/>
    <line x1="514" y1="72" x2="514" y2="196" stroke="#e8d48b" stroke-width="1.15" stroke-dasharray="3 3" opacity="0.8"/>
    <line x1="430" y1="196" x2="514" y2="196" stroke="#e8d48b" stroke-width="1.15" stroke-dasharray="3 3" opacity="0.8"/>
    <circle cx="514" cy="196" r="3.5" fill="#e8d48b"/>
    <text x="520" y="290" fill="#e8d48b" font-family="DejaVu Sans, Noto Sans, Liberation Sans, sans-serif" font-size="14">T2</text>
    <text x="366" y="200" fill="#c8d0dc" font-family="DejaVu Sans, Noto Sans, Liberation Sans, sans-serif" font-size="12">0.37</text>
    <text x="570" y="332" text-anchor="middle" fill="#c8d0dc" font-family="DejaVu Sans, Noto Sans, Liberation Sans, sans-serif" font-size="14">Mxy decays</text>
  </g>
</svg>
