<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 340" role="img" aria-labelledby="t d">
  <title id="t">Magnetic moment mu and B0</title>
  <desc id="d">A bar-magnet dipole next to B0 under torque, then mu parallel to B0 (low energy) and opposed (high energy).</desc>
  <rect width="780" height="340" fill="#0d1117"/>
  <defs>
    <marker id="b0" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
      <path d="M0 0 L10 5 L0 10 z" fill="#5eead4"/>
    </marker>
    <marker id="mu" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0 0 L9 4.5 L0 9 z" fill="#ff8b94"/>
    </marker>
    <marker id="tau" markerWidth="8" markerHeight="8" refX="6.5" refY="4" orient="auto">
      <path d="M0 0 L8 4 L0 8 z" fill="#8ab4ff"/>
    </marker>
  </defs>
  <g>
    <line x1="130" y1="250" x2="130" y2="62" stroke="#5eead4" stroke-width="7" stroke-linecap="round" marker-end="url(#b0)"/>
    <text x="148" y="78" fill="#5eead4" font-family="DejaVu Sans, Noto Sans, Liberation Sans, sans-serif" font-size="16">B0</text>
    <g transform="translate(168 188) rotate(-42)">
      <rect x="-10" y="-32" width="20" height="32" rx="2" fill="#c45c62"/>
      <rect x="-10" y="0" width="20" height="32" rx="2" fill="#3d6aa8"/>
      <text x="0" y="-12" text-anchor="middle" fill="#0d1117" font-family="DejaVu Sans, Noto Sans, Liberation Sans, sans-serif" font-size="11" font-weight="700">N</text>
      <text x="0" y="20" text-anchor="middle" fill="#e2e6ef" font-family="DejaVu Sans, Noto Sans, Liberation Sans, sans-serif" font-size="11" font-weight="700">S</text>
    </g>
    <line x1="130" y1="250" x2="214" y2="128" stroke="#ff8b94" stroke-width="2.6" marker-end="url(#mu)"/>
    <text x="222" y="124" fill="#ff8b94" font-family="DejaVu Serif, Liberation Serif, Georgia, serif" font-style="italic" font-size="18">&#x3BC;</text>
    <path d="M208 136 C196 108 164 92 142 98" fill="none" stroke="#8ab4ff" stroke-width="1.8" marker-end="url(#tau)"/>
    <text x="186" y="96" fill="#8ab4ff" font-family="DejaVu Serif, Liberation Serif, Georgia, serif" font-style="italic" font-size="16">&#x3C4;</text>
    <text x="130" y="312" text-anchor="middle" fill="#c8d0dc" font-family="DejaVu Sans, Noto Sans, Liberation Sans, sans-serif" font-size="14">Torque (&#x3C4;)</text>
  </g>
  <g>
    <line x1="390" y1="250" x2="390" y2="62" stroke="#5eead4" stroke-width="7" stroke-linecap="round" marker-end="url(#b0)"/>
    <text x="408" y="78" fill="#5eead4" font-family="DejaVu Sans, Noto Sans, Liberation Sans, sans-serif" font-size="16">B0</text>
    <line x1="390" y1="228" x2="390" y2="108" stroke="#ff8b94" stroke-width="3.2" marker-end="url(#mu)"/>
    <text x="408" y="128" fill="#ff8b94" font-family="DejaVu Serif, Liberation Serif, Georgia, serif" font-style="italic" font-size="18">&#x3BC;</text>
    <text x="390" y="312" text-anchor="middle" fill="#c8d0dc" font-family="DejaVu Sans, Noto Sans, Liberation Sans, sans-serif" font-size="14">Parallel (low energy)</text>
  </g>
  <g>
    <line x1="650" y1="250" x2="650" y2="62" stroke="#5eead4" stroke-width="7" stroke-linecap="round" marker-end="url(#b0)"/>
    <text x="668" y="78" fill="#5eead4" font-family="DejaVu Sans, Noto Sans, Liberation Sans, sans-serif" font-size="16">B0</text>
    <line x1="650" y1="108" x2="650" y2="228" stroke="#ff8b94" stroke-width="3.2" marker-end="url(#mu)"/>
    <text x="668" y="230" fill="#ff8b94" font-family="DejaVu Serif, Liberation Serif, Georgia, serif" font-style="italic" font-size="18">&#x3BC;</text>
    <text x="650" y="312" text-anchor="middle" fill="#c8d0dc" font-family="DejaVu Sans, Noto Sans, Liberation Sans, sans-serif" font-size="14">Opposed (high energy)</text>
  </g>
</svg>
