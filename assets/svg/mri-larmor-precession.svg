    </marker>
    <marker id="ahMu" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0 0 L9 4.5 L0 9 z" fill="#ff8b94"/>
    </marker>
    <marker id="ahW" markerWidth="8" markerHeight="8" refX="6.5" refY="4" orient="auto">
      <path d="M0 0 L8 4 L0 8 z" fill="#8ab4ff"/>
    </marker>
  </defs>
  <line x1="210" y1="348" x2="210" y2="42" stroke="#5eead4" stroke-width="2.6" stroke-linecap="round" marker-end="url(#ah)"/>
  <text x="226" y="56" fill="#5eead4" font-family="DejaVu Sans, Noto Sans, Liberation Sans, sans-serif" font-size="16">B0</text>
  <text x="226" y="344" fill="#c8d0dc" font-family="DejaVu Serif, Liberation Serif, Georgia, serif" font-style="italic" font-size="16">z</text>
  <ellipse cx="210" cy="168" rx="96" ry="26" fill="none" stroke="#5eead4" stroke-width="1.15" stroke-dasharray="4 4" opacity="0.7"/>
  <line x1="210" y1="292" x2="114" y2="168" stroke="#5eead4" stroke-width="1.15" stroke-dasharray="4 4" opacity="0.4"/>
  <line x1="210" y1="292" x2="306" y2="168" stroke="#5eead4" stroke-width="1.15" stroke-dasharray="4 4" opacity="0.4"/>
  <line x1="210" y1="292" x2="300" y2="176" stroke="#ff8b94" stroke-width="2.6" marker-end="url(#ahMu)"/>
  <text x="308" y="170" fill="#ff8b94" font-family="DejaVu Serif, Liberation Serif, Georgia, serif" font-style="italic" font-size="20">&#x3BC;</text>
  <path d="M288 150 C268 140 232 136 198 142" fill="none" stroke="#8ab4ff" stroke-width="1.7" marker-end="url(#ahW)"/>
