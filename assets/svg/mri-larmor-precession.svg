<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 400" role="img" aria-labelledby="t d">
  <title id="t">Larmor precession of mu around B0</title>
  <desc id="d">A mu / M vector on a cone around a vertical B0 axis, with a dashed precession circle labeled omega-zero.</desc>
  <rect width="420" height="400" fill="#0d1117"/>
  <defs>
    <marker id="ah" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
