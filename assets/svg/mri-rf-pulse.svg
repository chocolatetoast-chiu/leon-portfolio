  <text x="408" y="276" fill="#c8d0dc" font-family="DejaVu Serif, Liberation Serif, Georgia, serif" font-style="italic" font-size="18">x&#x2032;</text>
  <line x1="220" y1="270" x2="64" y2="304" stroke="#8ab4ff" stroke-width="1.7" stroke-linecap="round" marker-end="url(#ahY)"/>
  <text x="32" y="320" fill="#8ab4ff" font-family="DejaVu Serif, Liberation Serif, Georgia, serif" font-style="italic" font-size="18">y&#x2032;</text>
  <line x1="220" y1="270" x2="318" y2="270" stroke="#e8d48b" stroke-width="2.6" marker-end="url(#ahB1)"/>
