<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 460 400" role="img" aria-labelledby="t d">
  <title id="t">RF pulse flip angle in the rotating frame</title>
  <desc id="d">Rotating-frame axes with a still B1 along x-prime and magnetization tipping from z toward y-prime by flip angle alpha.</desc>
  <rect width="460" height="400" fill="#0d1117"/>
  <defs>
    <marker id="ahZ" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
